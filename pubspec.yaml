name: farmnet
description: FarmNet - Offline-First Crop Disease Detection and Advisory for Rural Communities.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  image: ^4.2.0
  tflite_flutter: ^0.11.0
  # Pinned to the last version that compiles against Android SDK 34 (newer
  # versions force SDK 35 + AGP 8, which breaks the TFLite namespace merge).
  flutter_plugin_android_lifecycle: 2.0.17
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/plant_disease.tflite
    - assets/data/labels.txt
    - assets/data/knowledge_base.json
