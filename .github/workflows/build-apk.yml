name: Build FarmNet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf /tmp/lib && cp -r lib /tmp/lib
          flutter create --platforms=android --org com.mindscriptsolutions --project-name farmnet .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib lib

      - name: Set app name to FarmNet
        run: |
          sed -i 's/android:label="farmnet"/android:label="FarmNet"/' android/app/src/main/AndroidManifest.xml || true

      - name: Ensure minSdk >= 24 (required by TensorFlow Lite)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f" || true
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$f" || true
            fi
          done

      - name: Add TensorFlow Lite R8 keep rules
        run: |
          printf '# Keep TensorFlow Lite classes so R8 does not strip/complain\n-keep class org.tensorflow.** { *; }\n-keep interface org.tensorflow.** { *; }\n-dontwarn org.tensorflow.**\n-dontwarn org.tensorflow.lite.gpu.**\n' > android/app/proguard-rules.pro

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FarmNet.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmNet-APK
          path: dist/FarmNet.apk
          if-no-files-found: error
